server:
  port: 8080

spring:
  application:
    name: agent-platform

  ai:
    model:
      chat: openai

    openai:
      base-url: ${MODEL_BASE_URL:https://api.deepseek.com}
      api-key: ${MODEL_API_KEY}
      chat:
        options:
          model: ${MODEL_NAME:deepseek-v4-flash}

agent:
  model:
    enabled: ${AGENT_MODEL_ENABLED:true}

  dev-api:
    enabled: ${AGENT_DEV_API_ENABLED:true}

  sample:
    enabled: ${AGENT_SAMPLE_ENABLED:true}

  auth:
    enabled: ${AGENT_AUTH_ENABLED:true}

  context:
    enabled: ${AGENT_CONTEXT_ENABLED:true}
    message-count-trimming-enabled: ${AGENT_CONTEXT_MESSAGE_COUNT_TRIMMING:true}
    max-messages: ${AGENT_CONTEXT_MAX_MESSAGES:20}
    token-trimming-enabled: ${AGENT_CONTEXT_TOKEN_TRIMMING:true}
    max-context-tokens: ${AGENT_CONTEXT_MAX_TOKENS:8192}
    reserved-output-tokens: ${AGENT_CONTEXT_RESERVED_OUTPUT:1024}
    reserved-protocol-tokens: ${AGENT_CONTEXT_RESERVED_PROTOCOL:256}
    safety-margin-tokens: ${AGENT_CONTEXT_SAFETY_MARGIN:128}
    summary:
      enabled: ${AGENT_CONTEXT_SUMMARY_ENABLED:true}
      trigger-ratio: ${AGENT_CONTEXT_SUMMARY_TRIGGER_RATIO:0.80}
      min-source-tokens: ${AGENT_CONTEXT_SUMMARY_MIN_SOURCE_TOKENS:512}
      max-summary-tokens: ${AGENT_CONTEXT_SUMMARY_MAX_TOKENS:512}
      recent-groups-to-preserve: ${AGENT_CONTEXT_SUMMARY_RECENT_GROUPS:4}

  memory:
    enabled: ${AGENT_MEMORY_ENABLED:true}
    backend: ${AGENT_MEMORY_BACKEND:in-memory}
    default-namespace: ${AGENT_MEMORY_DEFAULT_NAMESPACE:profile}
    max-namespace-length: ${AGENT_MEMORY_MAX_NAMESPACE_LENGTH:64}
    max-key-length: ${AGENT_MEMORY_MAX_KEY_LENGTH:128}
    max-value-length: ${AGENT_MEMORY_MAX_VALUE_LENGTH:4096}
    max-metadata-entries: ${AGENT_MEMORY_MAX_METADATA_ENTRIES:16}
    max-metadata-key-length: ${AGENT_MEMORY_MAX_METADATA_KEY_LENGTH:64}
    max-metadata-value-length: ${AGENT_MEMORY_MAX_METADATA_VALUE_LENGTH:256}
    context:
      enabled: ${AGENT_MEMORY_CONTEXT_ENABLED:true}
      namespaces:
        - rules
        - preferences
        - profile
        - facts
      max-entries: ${AGENT_MEMORY_CONTEXT_MAX_ENTRIES:20}
      max-injected-tokens: ${AGENT_MEMORY_CONTEXT_MAX_INJECTED_TOKENS:1024}
    tools:
      remember-enabled: ${AGENT_MEMORY_REMEMBER_TOOL_ENABLED:true}


  security:
    session:
      ttl: ${AGENT_SESSION_TTL:PT8H}